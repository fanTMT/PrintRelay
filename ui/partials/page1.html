<script>
    const PREVIEWABLE_IMAGE = [
        "image/png",
        "image/jpeg",
        "image/jpg",
        "image/gif",
        "image/webp",
    ];
    const PREVIEWABLE_PDF = ["application/pdf"];

    document.addEventListener("change", (e) => {
        const input = e.target;
        if (!input.matches('input[type="file"][data-preview="true"]')) return;

        const box = document.getElementById("local-preview");
        if (!box) return;
        box.innerHTML = "";

        const file = input.files && input.files[0];
        if (!file) return;

        // 非预览类型：只提示文件名和大小，不渲染
        const ext = (file.name.split(".").pop() || "").toLowerCase();
        const isPdf = file.type === "application/pdf" || ext === "pdf";
        const isImage =
            file.type.startsWith("image/") ||
            ["png", "jpg", "jpeg", "gif", "webp"].includes(ext);
        const isText = file.type === "text/plain" || ext === "txt";
        const isWord = ["doc", "docx"].includes(ext);

        if (isPdf) {
            const url = URL.createObjectURL(file);
            const iframe = document.createElement("iframe");
            iframe.src = url;
            iframe.width = "100%";
            iframe.height = "600";
            iframe.style.border = "1px solid #e5e7eb";
            iframe.style.borderRadius = "8px";
            iframe.style.marginTop = "12px";
            box.appendChild(iframe);
            // 不立即 revoke，避免部分浏览器渲染空白
            window.addEventListener(
                "beforeunload",
                () => URL.revokeObjectURL(url),
                { once: true },
            );
            return;
        }

        if (isImage) {
            const url = URL.createObjectURL(file);
            const img = document.createElement("img");
            img.src = url;
            img.alt = file.name;
            img.style.maxWidth = "100%";
            img.style.marginTop = "12px";
            img.style.borderRadius = "8px";
            img.style.border = "1px solid #e5e7eb";
            box.appendChild(img);
            window.addEventListener(
                "beforeunload",
                () => URL.revokeObjectURL(url),
                { once: true },
            );
            return;
        }

        if (isText) {
            const reader = new FileReader();
            reader.onload = () => {
                const pre = document.createElement("pre");
                pre.textContent = reader.result;
                pre.style.marginTop = "12px";
                pre.style.maxHeight = "400px";
                pre.style.overflow = "auto";
                box.appendChild(pre);
            };
            reader.readAsText(file, "utf-8");
            return;
        }

        if (isWord) {
            // doc/docx 浏览器无法原生渲染，提示下载或用 Office Online 打开
            const url = URL.createObjectURL(file);
            const p = document.createElement("p");
            p.style.marginTop = "12px";
            p.innerHTML = `Word 文件：<strong>${file.name}</strong>（${(file.size / 1024).toFixed(1)} KB）`;
            const a = document.createElement("a");
            a.href = url;
            a.download = file.name;
            a.textContent = "下载查看";
            a.style.marginLeft = "8px";
            box.appendChild(p);
            box.appendChild(a);
            window.addEventListener(
                "beforeunload",
                () => URL.revokeObjectURL(url),
                { once: true },
            );
            return;
        }

        // 其他类型
        const p = document.createElement("p");
        p.style.marginTop = "12px";
        p.textContent = `已选择：${file.name}（${(file.size / 1024).toFixed(1)} KB），不支持预览`;
        box.appendChild(p);
    });
</script>

<div class="page">
    <h2>上传文件</h2>
    <form
        hx-post="/upload"
        hx-encoding="multipart/form-data"
        hx-target="#upload-result"
        hx-swap="innerHTML"
    >
        <input
            type="file"
            name="file"
            data-preview="true"
            accept=".pdf,.txt,.doc,.docx,.png,.jpg,.jpeg,application/pdf,text/plain,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document,image/png,image/jpeg"
            required
            onchange="previewFile(this)"
        />
        <button type="submit">上传</button>
    </form>

    <div id="local-preview" style="margin-top: 12px"></div>
    <div id="upload-result"></div>
</div>
