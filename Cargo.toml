[package]
name = "psr"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["macros", "ws"] }
axum-extra = { version = "0.12.6", features = ["multipart"] }
# axum-signal = "0.1.3"
futures-util = "0.3.34"
jsonwebtoken = { version = "11.1.0", features = ["aws_lc_rs"] }
reqwest = { version = "0.13.5", features = ["json", "blocking"] }
rust-embed = { version = "8.12.0", features = [
    "axum",
    "debug-embed",
    "include-exclude",
    "mime-guess",
] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.9.0", features = [
    "runtime-tokio",
    "tls-rustls-ring-native-roots",
    "derive",
    "macros",
    "time",
    "uuid",
    "sqlite",
] }
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full"] }
# tower-http = { version = "0.7.1", features = ["fs", "trace", "cors"] }
uuid = { version = "1.26.1", features = ["serde", "v4"] }
tracing-subscriber = { version = "0.3.22", features = [
    "fmt",
    "env-filter",
    "json",
] }
tracing = "0.1.43"
time = { version = "0.3.44", features = [
    "local-offset",
    "serde",
    "formatting",
] }
mime_guess = "2.0.5"
tracing-appender = "0.2.5"
toml = "1.1.6"
dirs = "7.0.0"
clap = { version = "=4.6.4", features = ["derive"] }
if-addrs = "0.15.0"
sysinfo = "0.39.6"
sqlx-gen = "0.5.9"
